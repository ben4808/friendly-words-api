services:
  app:
    image: ${FRIENDLY_WORDS_IMAGE:-friendly-words:latest}
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:3001"
    networks: [shared]
    restart: unless-stopped

networks:
  shared:
    external: true
    name: cruzi-shared
